version: '3.8'

services:
  # MongoDB Database for persistent user and document storage
  mongodb:
    image: mongo:7-alpine
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=thutoshare
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - thutoshare-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/thutoshare
    volumes:
      - ./Backend:/app/backend
      - uploads:/app/backend/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - thutoshare-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - thutoshare-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  uploads:
    driver: local

networks:
  thutoshare-network:
    driver: bridge
